<style>
:root{
  --ink:#0f1b2d; --ink2:#3b4a5e; --mute:#6b7a8f; --line:#dde3ea; --bg:#f4f6f9; --card:#fff;
  --navy:#06789a; --navy2:#0b8fb3; --acc:#e8701a; --acc2:#fff1e6; --ok:#1f8a4c; --okbg:#e6f5ec;
  --warn:#b7791f; --warnbg:#fdf5e3; --bad:#c0392b; --badbg:#fbeaea; --blue:#2463b5; --bluebg:#e8f0fb;
  --r:10px; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif}
a{color:var(--blue)}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.3px;cursor:pointer}
.logo svg{flex:none}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand .b2{font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#ffd3ad;margin-top:3px}
.logo small{font-family:var(--mono);font-weight:600;color:var(--acc);font-size:13px;border:1px solid var(--acc);padding:0 6px;border-radius:4px}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav a{color:#e3f6fa;text-decoration:none;padding:6px 9px;border-radius:7px;font-size:13.5px;font-weight:500;position:relative}
nav a:hover{background:var(--navy2);color:#fff}
nav a.on{background:var(--navy2);color:#fff;box-shadow:inset 0 -2px 0 var(--acc)}
.badge-n{background:var(--acc);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:4px;font-weight:700}
.status{font-size:12px;color:#9fb0c6;font-family:var(--mono)}
main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:26px;margin:0 0 6px} h2{font-size:20px;margin:0 0 12px} h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
label .req{color:var(--acc)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c7d0db;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #f5b77f;border-color:var(--acc)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;border:1px solid var(--line);padding:6px 10px;border-radius:7px;cursor:pointer;background:#fafbfc}
.chk input{width:auto;margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:7px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy2)}
.btn.acc{background:var(--acc)}.btn.acc:hover{background:#cf5f0e}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #c7d0db}.btn.ghost:hover{background:#f1f4f8}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:#eef1f5;color:var(--ink2);margin:2px 4px 2px 0;white-space:nowrap}
.pill.p{background:var(--navy);color:#fff}
.pill.acc{background:var(--acc2);color:#a94c0a}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.blue{background:var(--bluebg);color:var(--blue)}
.pill.demo{background:#f0e9fb;color:#6b3fb0}
.mono{font-family:var(--mono)}
.muted{color:var(--mute)} .small{font-size:13px}
.note{border-left:3px solid var(--acc);background:var(--acc2);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;margin:10px 0}
.note.blue{border-color:var(--blue);background:var(--bluebg)}
.note.ok{border-color:var(--ok);background:var(--okbg)}
.note.bad{border-color:var(--bad);background:var(--badbg)}
.hero{background:linear-gradient(135deg,#06789a 0%,#17afc9 100%);color:#fff;border-radius:14px;padding:34px 30px;margin-bottom:20px;position:relative;overflow:hidden}
.hero h1{font-size:32px;line-height:1.15;max-width:700px}
.hero p{color:#eefafd;max-width:640px;font-size:16px}
.hero .grid-bg{position:absolute;inset:0;opacity:.09;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero .btn.ghost{background:transparent;color:#fff;border-color:#b5e6f0}
.kpi{font-size:28px;font-weight:700;font-family:var(--mono)}
.kpi-l{font-size:13px;color:var(--mute)}
.price{font-size:30px;font-weight:700;font-family:var(--mono);color:var(--navy)}
.price small{font-size:14px;color:var(--mute);font-weight:500}
.item{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:#fff;margin-bottom:12px}
.item-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item-h h3{margin:0}
.score{font-family:var(--mono);font-weight:700;font-size:20px;min-width:70px;text-align:center;border-radius:9px;padding:6px 8px;line-height:1.1}
.score small{display:block;font-size:10px;font-weight:600;letter-spacing:.5px}
.sc-hi{background:var(--okbg);color:var(--ok)}.sc-mid{background:var(--warnbg);color:var(--warn)}.sc-lo{background:#eef1f5;color:var(--mute)}
.bar{height:8px;background:#eef1f5;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.bar.p>i{background:var(--navy)}
.spec-row{display:grid;grid-template-columns:190px 1fr 46px;gap:10px;align-items:center;font-size:13px;margin:5px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.drop{border:2px dashed #b9c4d2;border-radius:var(--r);padding:22px;text-align:center;background:#fafbfd;cursor:pointer}
.drop.over{border-color:var(--acc);background:var(--acc2)}
.chat{display:grid;grid-template-columns:300px 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);background:#fff;min-height:520px;overflow:hidden}
.chat-l{border-right:1px solid var(--line);overflow:auto;max-height:620px}
.chat-li{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.chat-li:hover{background:#f6f8fb}.chat-li.on{background:var(--acc2)}
.chat-r{display:flex;flex-direction:column}
.chat-h{padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-m{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;max-height:470px;background:#f8fafc}
.msg{max-width:72%;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-color:var(--navy)}
.msg .t{display:block;font-size:11px;opacity:.6;margin-top:3px}
.msg.sys{align-self:center;background:var(--acc2);border-color:#f3c9a5;font-size:13px;max-width:90%;text-align:center}
.chat-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.modal-bg{position:fixed;inset:0;background:rgba(15,27,45,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.wide{max-width:900px}
.cvtext{white-space:pre-wrap;font:13.5px/1.55 'IBM Plex Sans',sans-serif;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:16px;max-height:58vh;overflow:auto;margin-top:10px}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;z-index:60;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td.mono{white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters>div{min-width:160px;flex:1}
.empty{text-align:center;color:var(--mute);padding:30px}
.steps{counter-reset:s;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 52px;position:relative}
.step:before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);margin:0}
.switch input{width:auto}
.status,#trbar{display:none!important}
.acct{background:#fff;color:var(--navy);border:0;border-radius:7px;padding:6px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.acct:hover{background:var(--acc2)}
.lang{background:var(--navy2);color:#fff;border:1px solid #5cc3da;border-radius:7px;padding:5px 8px;font-size:13px;width:auto}
.tr-o{display:block;font-size:11px;opacity:.75;margin-top:4px;cursor:pointer;text-decoration:underline}
.msg .orig{display:block;font-size:12px;opacity:.7;border-top:1px dashed rgba(127,127,127,.4);margin-top:5px;padding-top:4px}
.avatar{width:72px;height:96px;border-radius:8px;object-fit:cover;background:#e3eef2;flex:none;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:700;font-size:22px;overflow:hidden}
.avatar.sm{width:42px;height:56px;font-size:15px;border-radius:6px}
.avatar.lock{background:repeating-linear-gradient(135deg,#eef3f6,#eef3f6 6px,#e4ecf1 6px,#e4ecf1 12px);color:#8aa2b3;font-size:18px}
.photo-box{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafbfc;margin-top:4px}
.pwwrap{position:relative;display:block}
.pwwrap input{padding-right:44px}
.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px;color:var(--mute)}
.pweye:hover{background:#eef1f5}
.doc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fafbfc;margin-top:4px;font-size:13px}
.doc input[type=file]{border:0;padding:0;background:none}
.trbar{background:var(--bluebg);border-bottom:1px solid #c8d9f0;font-size:13px;padding:6px 18px;text-align:center}
[dir=rtl] .spec-row{direction:rtl}
@media(max-width:720px){
  .hwrap{padding:6px 12px 0;gap:4px 8px;flex-wrap:wrap;align-items:center}
  .logo{flex:1;min-width:0;font-size:19px;gap:9px;letter-spacing:.2px;white-space:nowrap}
  .logo svg{width:32px;height:32px}
  .logo small{font-size:13px;padding:0 5px}
  .brand .b2{font-size:13px;letter-spacing:4px;margin-top:4px}
  #acctBtn{order:2;padding:5px 7px;font-size:12px}
  #langSel{order:2;font-size:12px;padding:3px 2px;max-width:58px}
  .status{display:none}
  nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:0;margin:0 -12px;padding:0 8px 4px}
  nav::-webkit-scrollbar{display:none}
  nav{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  nav a{white-space:nowrap;padding:6px 10px;font-size:13px}
  main{padding:14px 12px 50px}
  .hero{padding:22px 18px}
.chat{grid-template-columns:1fr}.chat-l{max-height:200px;border-right:0;border-bottom:1px solid var(--line)}.spec-row{grid-template-columns:120px 1fr 40px}.hero h1{font-size:25px}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo" data-go="accueil">
    <svg width="30" height="30" viewBox="0 0 30 30"><rect width="30" height="30" rx="7" fill="#e8701a"/><path d="M6 22V8l5 7 4-7 4 7 5-7v14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span class="brand"><span class="b1">M4X Sourcing <small>2.0</small></span><span class="b2">Ingénierie</span></span>
  </div>
  <nav id="nav"></nav>
  <select id="langSel" class="lang notr" title="Langue / Language"></select>
  <button id="acctBtn" class="acct notr">Connexion</button>
  <span class="status" id="status">chargement…</span>
</div><div id="trbar"></div></header>
<main id="app"></main>
<div id="modal"></div>

<script src="/i18n.js"></script>
<script>
/* =========================================================
   M4X Sourcing 2.0 — prototype
   ========================================================= */
const PRICES = { cand: 20, comp: 500, compEI: 100, cabinet: 250, offer: 10 };
const ACCOUNT_KINDS = [['ENT','Entreprise',500],['EI','Entreprise individuelle / micro-entreprise',100],['CAB','Cabinet de recrutement',250]];
const compKind = p => p.kind || (isIndiv(p.legal)?'EI':'ENT');
const compPrice = p => ({ENT:PRICES.comp,EI:PRICES.compEI,CAB:PRICES.cabinet})[compKind(p)];
const kindLabel = k => (ACCOUNT_KINDS.find(x=>x[0]===k)||[])[1]||'';
const COUNTRIES = ['France','Belgique','Suisse','Luxembourg','Allemagne','Espagne','Italie','Portugal','Royaume-Uni','Pays-Bas','Pologne','Roumanie','Maroc','Algérie','Tunisie','Sénégal','Côte d\'Ivoire','Canada','États-Unis','Brésil','Émirats arabes unis','Arabie saoudite','Qatar','Inde','Chine','Singapour','Australie','Autre'];
const ZONES = {'Europe':['France','Belgique','Suisse','Luxembourg','Allemagne','Espagne','Italie','Portugal','Royaume-Uni','Pays-Bas','Pologne','Roumanie'],'Afrique':['Maroc','Algérie','Tunisie','Sénégal','Côte d\'Ivoire'],'Amériques':['Canada','États-Unis','Brésil'],'Moyen-Orient':['Émirats arabes unis','Arabie saoudite','Qatar'],'Asie-Pacifique':['Inde','Chine','Singapour','Australie']};
const zoneOf = c => Object.keys(ZONES).find(z=>ZONES[z].includes(c||'France'))||'Autre';
const LANGS = [['fr','Français'],['en','English'],['es','Español'],['de','Deutsch'],['it','Italiano'],['hi','हिन्दी']];
const langName = c => (LANGS.find(l=>l[0]===c)||[c,c])[1];
const YEAR = 365*864e5, MONTH = 30*864e5;

const SPECS = {
  TUY:{n:'Tuyauterie',core:true,kw:{'tuyauterie':4,'tuyauteur':4,'piping':4,'isometrique':3,'isometric':3,'iso ':1,'pdms':3,'e3d':3,'everything3d':3,'autoplant':3,'plant 3d':3,'caesar':3,'autopipe':3,'rohr2':3,'b31.3':4,'b31.1':4,'en 13480':4,'en13480':4,'rcc-m':2,'supportage':3,'supports de tuyauterie':4,'pipe support':3,'flexibilite':3,'stress analysis':3,'analyse de flexibilite':4,'p&id':2,'pid':1,'robinetterie':2,'vanne':1,'bride':1,'piquage':2,'line list':2,'spec tuyauterie':3,'classe de tuyauterie':3,'calorifuge':1,'soudure':1,'cheminement':2,'routing':2}},
  STR:{n:'Structures & charpente',core:true,kw:{'charpente':4,'charpentier':3,'structure metallique':4,'structures metalliques':4,'steel structure':4,'structural':3,'eurocode 3':4,'eurocode':2,'ec3':3,'cm66':3,'nv65':2,'tekla':4,'advance steel':4,'robot structural':4,'robot':1,'scia':3,'staad':3,'poutre':2,'portique':2,'assemblage':1,'platelage':2,'passerelle':1,'racks':1,'pipe rack':2,'massif':1,'descente de charges':3,'dimensionnement des structures':4,'ossature':2,'genie civil metallique':3}},
  MEC:{n:'Mécanique / conception',core:true,kw:{'conception mecanique':4,'mecanique':2,'mechanical design':4,'solidworks':4,'catia':4,'creo':3,'inventor':3,'topsolid':3,'rdm':2,'resistance des materiaux':3,'elements finis':3,'ansys':3,'fea':2,'abaqus':3,'machine speciale':3,'machines speciales':3,'mecanisme':2,'cotation':2,'gps':1,'tolerancement':2,'chaudronnerie':2,'equipement':1,'reservoir':2,'echangeur':2,'appareil a pression':3,'appareils a pression':3,'codap':3,'asme viii':3,'en 13445':3,'desp':2,'pv elite':3,'outillage':2}},
  IG:{n:'Installation générale',core:true,kw:{'installation generale':5,'implantation':3,'plot plan':4,'layout':3,'plant layout':4,'maquette 3d':3,'navisworks':3,'sp3d':3,'smartplant':3,'smart 3d':3,'synthese':2,'integration':2,'encombrement':2,'revue de maquette':3,'model review':3,'clash':2,'arrangement':2,'equipment layout':3,'general arrangement':3,'local':1,'reservations':2,'interfaces':1,'batiment industriel':2}},
  CHA:{n:'Chaudronnerie',core:false,kw:{'chaudronnerie':3,'chaudronnier':3,'tolerie':2,'mecano-soudure':2}},
  GC:{n:'Génie civil',core:false,kw:{'genie civil':4,'beton arme':4,'eurocode 2':3,'ferraillage':3,'fondations':2,'revit':1}},
  EI:{n:'Électricité / instrumentation',core:false,kw:{'electricite':3,'electrique':2,'instrumentation':4,'automatisme':3,'see electrical':3,'cablage':2,'hta':2,'bt ':1}},
  CVC:{n:'CVC / fluides',core:false,kw:{'cvc':4,'hvac':4,'ventilation':3,'climatisation':3,'plomberie':2,'fluides':2}},
  PRO:{n:'Procédés',core:false,kw:{'procede':3,'process engineer':4,'genie des procedes':4,'pfd':3,'bilan matiere':3,'hysys':3}}
};

const MONTHS={en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],es:['ene.','feb.','mar.','abr.','may.','jun.','jul.','ago.','sept.','oct.','nov.','dic.'],de:['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'],it:['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'],hi:['जन॰','फ़र॰','मार्च','अप्रैल','मई','जून','जुल॰','अग॰','सित॰','अक्तू॰','नव॰','दिस॰']};

function tKey(s){const v=[];const k=s.replace(TOK_RE,m=>{v.push(m);return '#';});return {k,v};}
function tApply(tpl,v,l){let i=0;const conv=x=>{if(x==null)return '';const mi=MONTHS_FR.indexOf(x);return mi>=0&&MONTHS[l]?MONTHS[l][mi]:x;};return tpl.replace(/#(\d+)?/g,(m,n)=>conv(n?v[+n-1]:v[i++]));}
function tLookup(s,l){const d=loadTrc(l);if(d[s]!=null)return d[s];const {k,v}=tKey(s);return d[k]!=null?tApply(d[k],v,l):null;}

function translateDom(){
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  if(LANG==='fr')return;
  const missing=window.__missing;
  const roots=[document.querySelector('header'),$('#app'),$('#modal')].filter(Boolean);
  for(const r of roots){
    for(const n of textNodes(r)){
      if(n.__fr==null)n.__fr=n.nodeValue; const k=n.__fr.trim(); if(!k)continue;
      const t=tLookup(k,LANG); if(t!=null){n.nodeValue=n.__fr.replace(k,t);}else missing.add(tKey(k).k);
    }
    r.querySelectorAll('[placeholder],[title]').forEach(el=>{['placeholder','title'].forEach(a=>{const v=el.getAttribute(a);if(!v||!hasWords(v))return;if(el['__fr_'+a]==null)el['__fr_'+a]=v;const k=el['__fr_'+a];const t=tLookup(k,LANG);if(t!=null)el.setAttribute(a,t);else missing.add(tKey(k).k);});});

  }
}

Return ONLY a JSON array of ${chunk.length} strings, same order.

${JSON.stringify(chunk)}`;

async function api(method,url,body,isForm){

  if(body!==undefined){if(isForm)opt.body=body;else{opt.headers['content-type']='application/json';opt.body=JSON.stringify(body);}}

  let d={};try{d=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(d.error||('Erreur '+r.status));e.status=r.status;throw e;}
  return d;
}

/* ---------- CV analysis ---------- */
function analyzeCV(raw){
  const t=' '+norm(raw).replace(/\s+/g,' ')+' ';
  const scores={};
  for(const [k,sp] of Object.entries(SPECS)){
    let s=0;
    for(const [w,wt] of Object.entries(sp.kw)){
      const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
      const m=(t.match(re)||[]).length; s+=Math.min(m,3)*wt;
    }
    scores[k]=s;
  }
  const ranked=Object.entries(scores).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const top=ranked[0]?ranked[0][1]:0;
  const coreRanked=ranked.filter(([k])=>SPECS[k].core);
  const primary=coreRanked[0]?coreRanked[0][0]:(ranked[0]?ranked[0][0]:'');
  const secondary=ranked.filter(([k,v])=>k!==primary&&v>=Math.max(4,top*0.2)).map(([k])=>k);
  const software=SOFTS.filter(s=>t.includes(norm(s)));
  const sectors=Object.entries(SECTORS).filter(([,ws])=>ws.some(w=>t.includes(' '+w)||t.includes(w+' '))).map(([n])=>n);
  const norms=NORMS.filter(n=>t.includes(norm(n)));
  let years=0; const m=t.match(/(\d{1,2})\s*\+?\s*ans?\s*(d['’ ]?\s?)?(experience|exp)/); if(m)years=+m[1];
  if(!years){const ys=(t.match(/\b(19[89]\d|20[0-2]\d)\b/g)||[]).map(Number);if(ys.length>1){years=Math.max(0,new Date().getFullYear()-Math.min(...ys));if(years>45)years=0;}}
  let level='';
  if(/ingenieur|engineer/.test(t))level='Ingénieur';
  if(/projeteur|designer/.test(t)&&(!level||(t.match(/projeteur/g)||[]).length>=(t.match(/ingenieur/g)||[]).length))level='Projeteur';
  if(!level&&/dessinateur|draftsman/.test(t))level='Dessinateur';
  const email=(raw.match(/[\w.+-]+@[\w-]+\.[\w.-]+/)||[''])[0];
  const phone=(raw.match(/(?:\+33\s?|0)[1-9](?:[\s.-]?\d{2}){4}/)||[''])[0];
  return {scores,primary,secondary,software,sectors,norms,years,level,email,phone,confidence:top>=25?'élevée':top>=10?'moyenne':'faible'};
}
async function extractText(file){
  const name=file.name.toLowerCase();
  const buf=await file.arrayBuffer();
  if(name.endsWith('.pdf')){
    if(!window.pdfjsLib)throw new Error('Lecteur PDF indisponible');
    const pdf=await pdfjsLib.getDocument({data:buf}).promise; let out='';
    for(let i=1;i<=Math.min(pdf.numPages,15);i++){const p=await pdf.getPage(i);const c=await p.getTextContent();out+=c.items.map(x=>x.str).join(' ')+'\n';}
    return out;
  }
  if(name.endsWith('.docx')){
    if(!window.mammoth)throw new Error('Lecteur Word indisponible');
    return (await mammoth.extractRawText({arrayBuffer:buf})).value;
  }
  return new TextDecoder().decode(buf);
}

/* ---------- matching ---------- */
function matchScore(c,o){
  if(!c||!o)return {total:0,parts:{}};
  const skills=[c.primary,...(c.secondary||[])];
  const p={};
  p.spec = c.primary===o.specialty?40:(c.secondary||[]).includes(o.specialty)?22:0;
  const os=o.secondary||[];
  p.sec = os.length? Math.round(15*os.filter(x=>skills.includes(x)).length/os.length) : (p.spec?10:0);
  const ct=(c.dispo&&c.dispo.types)||[];
  p.contract = (o.contract||[]).some(x=>ct.includes(x))?15:0;
  const dd=c.dispo&&c.dispo.date?new Date(c.dispo.date).getTime():null, st=o.start?new Date(o.start).getTime():null;
  p.date = (!dd||!st)?7:(dd<=st?15:(dd-st<=MONTH?8:0));
  const osw=o.software||[], csw=(c.software||[]).map(norm);
  p.soft = osw.length? Math.round(15*osw.filter(x=>csw.includes(norm(x))).length/osw.length) : 10;
  return {total:Math.min(100,p.spec+p.sec+p.contract+p.date+p.soft),parts:p};
}

/* ---------- Photo portrait ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('image illisible'));i.src=u;});}
async function processPortrait(file){
  if(!/^image\/(jpeg|png|webp)$/i.test(file.type)&&!/\.(jpe?g|png|webp)$/i.test(file.name))throw new Error('format non accepté (JPG, PNG ou WebP)');
  if(file.size>15*1048576)throw new Error('fichier trop lourd (15 Mo max)');
  const img=await loadImg(file); const w=img.naturalWidth,h=img.naturalHeight;
  if(h<=w)throw new Error('la photo doit être au format portrait (plus haute que large)');
  if(w<200||h<260)throw new Error('photo trop petite (minimum 200 × 260 pixels)');
  // recadrage centré au format 3:4, réduit à 300 × 400
  let cw=w,ch=Math.round(w*4/3); if(ch>h){ch=h;cw=Math.round(h*3/4);}
  const cv=document.createElement('canvas');cv.width=300;cv.height=400;
  cv.getContext('2d').drawImage(img,(w-cw)/2,(h-ch)/4,cw,ch,0,0,300,400);
  return cv.toDataURL('image/jpeg',0.82);
}
const initials = n => String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');

  return `<div class="${cls}">${esc(initials(c&&c.name))}</div>`;
}

bind.compte=()=>{
  if(!AUTH)return;
  $('#logoutBtn').onclick=logout;
  $('#pwF').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    try{await api('POST','/api/auth/password',d);e.target.reset();toast('Mot de passe modifié');}catch(err){toast(err.message);}};
  $('#delF').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    modal(`<h2>Supprimer votre compte ?</h2><p>Cette action est <b>définitive</b> : profils, offres, documents, photo et conversations seront effacés.</p><div class="row"><button class="btn ghost" data-close>Annuler</button><button class="btn bad" id="delGo">Oui, supprimer</button></div>`);
    $('#delGo').onclick=async()=>{try{await api('DELETE','/api/auth/account',{password:d.password});closeModal();AUTH=null;ME='';IS_OWNER=false;COLS.forEach(c=>{S.live[c]={};});go('accueil');await loadData();toast('Compte supprimé');}catch(err){closeModal();toast(err.message);}};};
};

  cgv:`<h2>Conditions générales de vente</h2>

  cgu:`<h2>Conditions générales d'utilisation</h2>
   <p>L'inscription est réservée aux personnes majeures et aux personnes morales régulièrement immatriculées. L'utilisateur garantit l'exactitude des informations et documents fournis (CV, dossier de compétences, justificatifs). Le CV complet et le dossier de compétences d'un candidat sont consultables uniquement par les entreprises et cabinets abonnés, pour un usage strictement limité au recrutement ; toute extraction ou diffusion à des tiers est interdite. Les coordonnées complètes d'un candidat ne sont révélées dans la fiche qu'après un match, c'est-à-dire un intérêt réciproque. La messagerie est réservée aux échanges professionnels liés au recrutement ; tout démarchage non sollicité, contenu illicite ou discriminatoire est interdit (art. L1132-1 du Code du travail). Un bouton de signalement sera disponible sur chaque annonce et chaque conversation.</p>`,
  rgpd:`<h2>Données personnelles (RGPD)</h2>

/* ---------- Comparateur CDI / CDD / Freelance / Portage (tableur) ---------- */
const CMP_DEF={brut:50000,salariales:22,patronales:42,avantages:3000,joursCDI:218,dureeCDD:12,precarite:10,iccp:10,tjm:450,joursFree:210,microTaux:25.6,fraisPro:3000,plafond:83600,gestion:8,tauxNetPortage:50,joursPortage:210,ir:'—'};
let CMP={...CMP_DEF};try{Object.assign(CMP,JSON.parse(localStorage.getItem('m4x_cmp')||'{}'));}catch(e){}
const CMP_FIELDS=[
 ['CDI / CDD (salariat)',[['brut','Salaire brut annuel','€'],['salariales','Charges salariales','%'],['patronales','Charges patronales','%'],['avantages','Avantages employeur (mutuelle, tickets, prime…)','€/an'],['joursCDI','Jours travaillés par an','j'],['dureeCDD','Durée du CDD','mois'],['precarite','Indemnité de fin de contrat (CDD)','%'],['iccp','Indemnité compensatrice de congés (CDD)','%']]],
 ['Freelance (micro-entreprise BNC)',[['tjm','Taux journalier (TJM)','€ HT'],['joursFree','Jours facturés par an','j'],['microTaux','Cotisations sociales micro BNC (2026)','%'],['fraisPro','Frais professionnels (assurance RC, matériel, comptable…)','€/an'],['plafond','Plafond CA micro (services, 2026)','€']]],
 ['Portage salarial',[['gestion','Frais de gestion de la société de portage','%'],['tauxNetPortage','Net / CA après frais de gestion','%'],['joursPortage','Jours facturés par an','j']]]];
function cmpCalc(v){
  const n=k=>+v[k]||0;
  const cdiCost=n('brut')*(1+n('patronales')/100)+n('avantages'), cdiNet=n('brut')*(1-n('salariales')/100);
  const m=n('dureeCDD')/12, cddBrut=n('brut')*m*(1+n('precarite')/100)*(1+n('iccp')/100);
  const cddCost=cddBrut*(1+n('patronales')/100)+n('avantages')*m, cddNet=cddBrut*(1-n('salariales')/100), cddJ=n('joursCDI')*m;
  const ca=n('tjm')*n('joursFree'), freeNet=ca*(1-n('microTaux')/100)-n('fraisPro');
  const caP=n('tjm')*n('joursPortage'), portNet=caP*(1-n('gestion')/100)*n('tauxNetPortage')/100;
  return {cols:['CDI','CDD','Freelance (micro)','Portage salarial'],
    cost:[cdiCost,cddCost,ca,caP], days:[n('joursCDI'),cddJ,n('joursFree'),n('joursPortage')], net:[cdiNet,cddNet,freeNet,portNet], months:[12,n('dureeCDD')||12,12,12], over:ca>n('plafond')};
}
const e0 = x => isFinite(x)?Math.round(x).toLocaleString('fr-FR')+' €':'—';
const QUAL=[
 ['Engagement de l\'entreprise','Long terme','Durée fixée (motif obligatoire)','À la mission','À la mission'],
 ['Fin de collaboration','Rupture encadrée, préavis, indemnités','Terme du contrat','Selon contrat commercial','Selon contrat commercial'],
 ['Délai de mise en place','Long (préavis 1 à 3 mois)','Moyen','Rapide','Rapide'],
 ['Protection sociale du professionnel','Complète (chômage, prévoyance)','Complète (chômage)','Réduite (pas de chômage)','Salarié (chômage, mutuelle)'],
 ['Congés payés','Oui','Indemnité 10 %','Non facturés','Inclus dans le calcul'],
 ['Gestion administrative entreprise','Paie, RH','Paie, RH','Facture fournisseur','Facture fournisseur'],
 ['Risque de requalification','—','Si besoin permanent','Si lien de subordination','Faible'],
 ['Idéal pour','Besoin durable, savoir-faire à garder','Pic d\'activité, remplacement','Expertise ponctuelle, démarrage rapide','Mission longue sans créer de société']];
function vCompare(){
  const r=cmpCalc(CMP);
  const row=(lab,arr,f=e0,cls='')=>`<tr class="${cls}"><td>${lab}</td>${arr.map(x=>`<td class="mono" style="text-align:right">${f(x)}</td>`).join('')}</tr>`;
  const perDay=r.cost.map((c,i)=>c/(r.days[i]||1)), netM=r.net.map((x,i)=>x/(r.months[i]||12)), ratio=r.net.map((x,i)=>x/(r.cost[i]||1));
  return `<h1>Comparatif CDI, CDD, freelance et portage</h1>
  <p class="sub">Comparez le coût pour l'entreprise et le revenu net pour le professionnel. Modifiez les cellules en orange : tout se recalcule.</p>
  <div class="grid g2" style="grid-template-columns:minmax(300px,420px) 1fr">
   <div class="card"><div class="item-h"><h2>Hypothèses</h2><button class="btn ghost sm" id="cmpReset">Valeurs par défaut</button></div>
    ${CMP_FIELDS.map(([g,fs])=>`<h3 style="margin-top:12px">${g}</h3><table><tbody>${fs.map(([k,l,u])=>`<tr><td class="small">${l}</td><td style="width:120px"><input class="mono cmpIn" id="cmp_${k}" data-k="${k}" type="number" step="any" value="${esc(CMP[k])}" style="text-align:right;background:var(--acc2);padding:5px 7px"></td><td class="small muted" style="width:44px">${u}</td></tr>`).join('')}</tbody></table>`).join('')}
    <p class="small muted" style="margin-top:10px">Valeurs par défaut : barèmes 2026 (micro-entreprise BNC 25,6 %, plafond 83 600 €) et ordres de grandeur courants. À adapter à chaque situation.</p>
   </div>
   <div>
    <div class="card"><div class="item-h"><h2>Résultats annuels</h2><button class="btn sm" id="cmpCopy">Copier vers Excel / tableur</button></div>
     <div style="overflow-x:auto"><table id="cmpTable"><thead><tr><th></th>${r.cols.map(c=>`<th style="text-align:right">${c}</th>`).join('')}</tr></thead><tbody>
      ${row('<b>Coût pour l\'entreprise</b>',r.cost)}
      ${row('Jours travaillés / facturés',r.days,x=>Math.round(x)+' j')}
      ${row('<b>Coût par jour</b>',perDay)}
      ${row('<b>Revenu net du professionnel</b> (avant impôt)',r.net)}
      ${row('Net mensuel moyen',netM)}
      ${row('Part du coût qui revient au professionnel',ratio,x=>isFinite(x)?Math.round(x*100)+' %':'—')}
     </tbody></table></div>
     ${r.over?'<div class="note bad small">Le chiffre d\'affaires freelance dépasse le plafond de la micro-entreprise : au-delà de deux années consécutives, passage au régime réel (EURL, SASU…).</div>':''}
     <div class="note blue small">Le CDD est calculé sur sa durée (${esc(CMP.dureeCDD)} mois). Les montants nets s'entendent avant impôt sur le revenu. Simulation indicative, sans valeur de conseil juridique, fiscal ou social.</div>
    </div>
    <div class="card"><h2>Comparatif qualitatif</h2><div style="overflow-x:auto"><table><thead><tr><th></th>${r.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
     ${QUAL.map(q=>`<tr><td><b class="small">${q[0]}</b></td>${q.slice(1).map(x=>`<td class="small">${x}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div>
   </div>
  </div>
  <textarea id="cmpTsv" class="notr" style="display:none"></textarea>`;
}
function cmpTsv(){
  const r=cmpCalc(CMP), perDay=r.cost.map((c,i)=>c/(r.days[i]||1)), netM=r.net.map((x,i)=>x/(r.months[i]||12));
  const L=[['M4X Sourcing 2.0 — comparatif',...r.cols],['Coût entreprise (€)',...r.cost.map(Math.round)],['Jours',...r.days.map(Math.round)],['Coût par jour (€)',...perDay.map(Math.round)],['Revenu net avant IR (€)',...r.net.map(Math.round)],['Net mensuel (€)',...netM.map(Math.round)],[],['Hypothèses','Valeur']];
  CMP_FIELDS.forEach(([,fs])=>fs.forEach(([k,l,u])=>L.push([l+' ('+u+')',CMP[k]])));
  return L.map(r=>r.join('\t')).join('\n');
}
bind.comparateur=()=>{
  document.querySelectorAll('.cmpIn').forEach(i=>i.oninput=()=>{CMP[i.dataset.k]=i.value;try{localStorage.setItem('m4x_cmp',JSON.stringify(CMP));}catch(e){}render();});
  $('#cmpReset').onclick=()=>{CMP={...CMP_DEF};try{localStorage.removeItem('m4x_cmp');}catch(e){}render();};
  $('#cmpCopy').onclick=async()=>{const t=cmpTsv();try{await navigator.clipboard.writeText(t);toast('Tableau copié : collez-le dans Excel ou Google Sheets');}catch(e){const ta=$('#cmpTsv');ta.style.display='block';ta.value=t;ta.select();toast('Sélectionnez le texte et copiez-le (Ctrl+C)');}};
};

function anaPanel(a){
  const max=Math.max(1,...Object.values(a.scores||{}));
  const rows=Object.entries(a.scores||{}).filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]);
  return `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
   <h3>Analyse automatique ${a.confidence?`<span class="pill ${a.confidence==='élevée'||a.confidence==='IA'?'ok':a.confidence==='moyenne'?'warn':'bad'}">${a.confidence==='IA'?'affinée par IA':'confiance '+a.confidence}</span>`:''}</h3>
   ${a.summary?`<p class="small" style="margin:0 0 6px"><i>${esc(a.summary)}</i></p>`:''}
   <p style="margin:4px 0 8px">Principale : ${a.primary?`<span class="pill p">${esc(specName(a.primary))}</span>`:'<span class="muted">non déterminée</span>'}
   ${a.secondary&&a.secondary.length?`<br>Secondaires : ${a.secondary.map(k=>`<span class="pill ${SPECS[k].core?'':'blue'}">${esc(specName(k))}</span>`).join('')}`:''}</p>
   ${rows.map(([k,v])=>`<div class="spec-row"><span>${esc(specName(k))}</span><div class="bar ${k===a.primary?'p':''}"><i style="width:${Math.round(100*v/max)}%"></i></div><span class="mono">${v}</span></div>`).join('')||'<p class="small muted">Aucun mot-clé métier reconnu.</p>'}
   <p class="small" style="margin:8px 0 0">${a.level?`<b>${esc(a.level)}</b> · `:''}${a.years?a.years+' ans d\'expérience · ':''}${(a.software||[]).map(esc).join(', ')||'aucun logiciel repéré'}</p>
   ${(a.norms||[]).length?`<p class="small" style="margin:2px 0 0">Normes : ${a.norms.map(esc).join(', ')}</p>`:''}
   ${(a.sectors||[]).length?`<p class="small" style="margin:2px 0 0">Secteurs : ${a.sectors.map(esc).join(', ')}</p>`:''}
  </div>`;
}
bind.candidat=()=>{

Return ONLY JSON: {"primary":code (prefer TUY, STR, MEC or IG when relevant),"secondary":[codes],"level":"Ingénieur"|"Projeteur"|"Dessinateur"|"Chef de projet"|"Technicien","years":number,"software":[names],"norms":[standards],"sectors":[industries in French],"summary":"one sentence in French"}.
CV:
${t.slice(0,12000)}`,{modelTier:'default'});
        const base=ui.cvDraft||analyzeCV(t);

        else throw new Error('réponse invalide');
      }catch(e){toast(e&&e.code==='not_granted'?'Analyse IA non autorisée':'Analyse IA impossible pour le moment');ai.disabled=false;ai.textContent='✦ Affiner avec l\'IA (CV en toutes langues)';}};
    const handle=async f=>{if(!f)return;if(f.size>20*1048576)return toast('Fichier trop lourd (20 Mo max)');$('#cvMsg').textContent='Lecture de '+f.name+'…';try{const t=await extractText(f);ui.cvText=t;ui.cvName=f.name;ui.cvFileObj=f;ui.cvDraft=analyzeCV(t);ui.anaFresh=true;render();toast('CV analysé');}catch(e){ui.cvFileObj=f;ui.cvName=f.name;$('#cvMsg').textContent='Fichier reçu mais texte illisible ('+e.message+'). Collez le texte du CV ci-dessous.';}};

    $('#anaBtn').onclick=()=>{const t=$('#cvText').value;if(t.trim().length<30)return toast('Texte trop court');ui.cvText=t;ui.cvDraft=analyzeCV(t);ui.anaFresh=true;render();};

function vMatches(){
  if(!AUTH)return authGate('matchs');
  const c=myCand(),p=myComp();
  if(!c&&!p)return `<h1>Matchs &amp; messages</h1><div class="card"><p>Inscrivez-vous comme candidat ou entreprise pour accéder aux matchs.</p><div class="row" style="max-width:420px"><button class="btn acc" data-go="candidat">Espace candidat</button><button class="btn" data-go="entreprise">Espace entreprise</button></div></div>`;
  if(!(subOk(c)||subOk(p)))return `<h1>Matchs &amp; messages</h1>${lockCard(c||p,c?'candidat':'entreprise')}`;
  const links=myLinks().filter(l=>{const oc=mySide(l)==='cand'?get('comps',l.compId):get('cands',l.candId);return isDemo(oc&&oc.id)||subOk(oc);}); const matches=links.filter(isMatch).sort((a,b)=>lastAt(b)-lastAt(a));
  const pendingOut=links.filter(l=>!isMatch(l)&&((c&&l.candId===c.id&&l.candLiked)||(p&&l.compId===p.id&&l.compLiked)));
  if(!ui.chat||!matches.find(m=>m.id===ui.chat))ui.chat=matches[0]&&matches[0].id;
  return `<h1>Matchs &amp; messages</h1><p class="sub">Un canal s'ouvre dès que l'intérêt est réciproque.</p>
  ${matches.length?`<div class="chat"><div class="chat-l">${matches.map(l=>{const o=other(l);const lm=all('msgs').filter(m=>m.linkId===l.id).sort((a,b)=>b.at-a.at)[0];
     return `<div class="chat-li ${ui.chat===l.id?'on':''}" data-chat="${l.id}"><b>${esc(o.name)}</b> ${isDemo(o.id)?'<span class="pill demo">démo</span>':''}<div class="small muted">${esc(o.sub)}</div><div class="small" style="color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${lm?esc(lm.text):'<i>Nouveau match</i>'}</div></div>`;}).join('')}</div>
     <div class="chat-r" id="chatR">${chatPane()}</div></div>`:'<div class="card empty">Aucun match pour l\'instant. Manifestez votre intérêt pour des offres ou des profils.</div>'}
  ${pendingOut.length?`<div class="card" style="margin-top:16px"><h3>En attente de réponse</h3>${pendingOut.map(l=>{const o=other(l);return `<div class="small" style="padding:4px 0">${esc(o.name)} — ${esc(o.sub)} <span class="muted">· envoyé le ${fmtD(l.candAt||l.compAt)}</span></div>`;}).join('')}</div>`:''}`;
}
const lastAt = l => Math.max(l.candAt||0,l.compAt||0,...all('msgs').filter(m=>m.linkId===l.id).map(m=>m.at));
function mySide(l){const c=myCand();return c&&l.candId===c.id?'cand':'comp';}
function other(l){
  if(mySide(l)==='cand'){const p=get('comps',l.compId)||{};const o=get('offers',l.offerId);return {id:p.id,name:p.name||'Entreprise',sub:o?o.title:(p.city||''),web:p.website,email:p.email,contact:p.contact};}
  const c=get('cands',l.candId)||{};return {id:c.id,cand:c,name:c.name||'Candidat',sub:`${tr(c.level||'')} · ${tr(specName(c.primary))}`,email:c.email,phone:c.phone};
}
function chatPane(){
  const l=get('links',ui.chat);if(!l)return '';
  const side=mySide(l),o=other(l);
  try{localStorage.setItem('m4x_seen_'+l.id,Date.now());}catch(e){}
  const msgs=all('msgs').filter(m=>m.linkId===l.id).sort((a,b)=>a.at-b.at);
  return `<div class="chat-h" style="display:flex;gap:10px;align-items:center">${o.cand?avatar(o.cand,true,true):''}<div><b>${esc(o.name)}</b> <span class="small muted">· ${esc(o.sub)}</span><div class="small muted">${o.email?'✉ '+esc(o.email):''}${o.phone?' · ☎ '+esc(o.phone):''}${o.web?` · <a href="${esc(o.web)}" target="_blank" rel="noopener">site</a>`:''}</div></div></div>
   <div class="chat-m" id="chatM"><div class="msg sys">Match le ${fmtD(Math.max(l.candAt||0,l.compAt||0))} — vous pouvez échanger librement.</div>
   ${msgs.map(m=>{const mine=m.side===side;const t=!mine&&AUTO_TR?MTR[m.id+'|'+LANG]:null;const diff=t&&t.trim()!==m.text.trim();
     return `<div class="msg notr ${mine?'me':''}">${esc(diff?t:m.text)}${diff?`<span class="orig">${esc(m.text)}</span>`:''}<span class="t">${fmtT(m.at)}${diff?' · '+esc(tr('traduit automatiquement')):''}</span></div>`;}).join('')}</div>
${TR_ON?`   <div class="small" style="padding:6px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><label class="switch"><input type="checkbox" id="autoTr" ${AUTO_TR?'checked':''}> Traduire automatiquement les messages reçus en <span class="notr">&nbsp;${esc(langName(LANG))}</span></label><span class="muted">Traduction DeepL</span></div>`:''}
   <form class="chat-f" id="chatF"><input id="chatIn" placeholder="Votre message…" autocomplete="off" value="${esc(ui.draft||'')}"><button class="btn acc">Envoyer</button></form>`;
}
function renderChatOnly(fromTr){const r=$('#chatR');if(!r){ui.typing=false;return render();}const wasTyping=ui.typing;r.innerHTML=chatPane();bindChat();translateDom();const i=$('#chatIn');if(i&&wasTyping){i.focus();i.setSelectionRange(i.value.length,i.value.length);}renderNav();}
function bindChat(){
  const m=$('#chatM');if(m)m.scrollTop=m.scrollHeight;
  const at=$('#autoTr');if(at)at.onchange=()=>{AUTO_TR=at.checked;try{localStorage.setItem('m4x_autotr',AUTO_TR?'1':'0');}catch(e){}renderChatOnly();};
  const l=get('links',ui.chat);if(l&&AUTO_TR&&TR_ON){const side=mySide(l);translateMsgs(all('msgs').filter(x=>x.linkId===l.id&&x.side!==side));}
  const f=$('#chatF');if(!f)return;
  const i=$('#chatIn');i.oninput=()=>{ui.draft=i.value;};i.onfocus=()=>{ui.typing=true;};i.onblur=()=>{setTimeout(()=>{ui.typing=false;},150);};
  f.onsubmit=e=>{e.preventDefault();const t=i.value.trim();if(!t)return;const l=get('links',ui.chat);
    const mine=mySide(l)==='cand'?get('cands',l.candId):get('comps',l.compId);if(!subOk(mine))return toast('Abonnement requis pour envoyer des messages');ui.draft='';
    save('msgs',{id:uid(isDemo(l.candId)||isDemo(l.compId)?'demo-msg':'msg'),linkId:l.id,side:mySide(l),authorId:ME,text:t.slice(0,4000),at:Date.now()},isDemo(l.candId)||isDemo(l.compId));};
}
bind.matchs=()=>{document.querySelectorAll('[data-chat]').forEach(d=>d.onclick=()=>{ui.chat=d.dataset.chat;ui.draft='';ui.typing=false;render();});bindChat();};

bind.admin=()=>{
  document.querySelectorAll('[data-grant]').forEach(b=>b.onclick=()=>{const [col,id]=b.dataset.grant.split(':');const x=get(col,id);if(!x)return;
    const def=col==='cands'?PRICES.cand:compPrice(x);
    modal(`<h2>Activer un abonnement d'un an</h2><p><b>${esc(x.name)}</b> — à utiliser après réception du règlement (virement). Démarre à la fin de la période en cours.</p>
     <label>Montant reçu (€)</label><input type="number" id="grAmt" min="0" value="${def}"><div class="row" style="margin-top:14px"><button class="btn ghost" data-close>Annuler</button><button class="btn acc" id="grGo">Activer</button></div>`);
    $('#grGo').onclick=async()=>{try{await api('POST','/api/admin/grant',{col,id,amount:+$('#grAmt').value||0});closeModal();toast('Abonnement activé pour 1 an');loadData();}catch(e){toast(e.message);}};});
  const lu=$('#loadUsers');if(lu)lu.onclick=async()=>{try{const r=await api('GET','/api/admin/users');ui.adminUsers=r.users;render();}catch(e){toast(e.message);}};
  document.querySelectorAll('[data-rpw]').forEach(b=>b.onclick=()=>{
    modal(`<h2>Réinitialiser le mot de passe ?</h2><p>Un mot de passe provisoire va être créé pour <b class="notr">${esc(b.dataset.rpw)}</b> ; ses sessions en cours seront fermées.</p><div class="row"><button class="btn ghost" data-close>Annuler</button><button class="btn acc" id="rpwGo">Réinitialiser</button></div>`);
    $('#rpwGo').onclick=async()=>{try{const x=await api('POST','/api/admin/reset-password',{email:b.dataset.rpw});
      modal(`<h2>Mot de passe provisoire</h2><p>Communiquez ce mot de passe à <b class="notr">${esc(b.dataset.rpw)}</b> ; il pourra le changer dans « Mon compte ».</p><p class="mono notr" style="font-size:22px">${esc(x.temp)}</p><button class="btn" data-close>Fermer</button>`);}catch(e){toast(e.message);}};});
  const te=$('#trEnd');
  document.querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>{const base=new Date(Math.max(Date.now(),new Date(te.value+'T12:00:00').getTime()||0));base.setDate(base.getDate()+ +b.dataset.ext);te.value=base.toISOString().slice(0,10);toast('Nouvelle date : '+fmtD(base)+' — cliquez sur Enregistrer');});
  $('#trSave').onclick=()=>{if(!te.value)return toast('Indiquez une date de fin');save('settings',{id:'launch',trialOn:$('#trOn').checked,end:te.value,promoOn:$('#prOn').checked,promoEnd:$('#prEnd').value||LAUNCH_DEF.promoEnd,candCap:+$('#prCC').value||0,candMonths:+$('#prCM').value||0,compCap:+$('#prEC').value||0,compMonths:+$('#prEM').value||0,offersFree:$('#prOF').checked,updatedAt:Date.now(),by:ME});toast('Période d\'essai mise à jour');};document.querySelectorAll('[data-verif]').forEach(b=>b.onclick=()=>{const [id,v]=b.dataset.verif.split(':');const c=get('comps',id);save('comps',{...c,verif:v,verifAt:Date.now()});toast(v==='ok'?'Justificatifs validés':'Justificatifs refusés');});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const [c,id]=b.dataset.del.split(':');remove(c,id);toast('Supprimé');});};

function suggestLang(){
  const bl=(navigator.language||'fr').slice(0,2).toLowerCase(); let asked=false;try{asked=localStorage.getItem('m4x_lang')!=null||localStorage.getItem('m4x_langask');}catch(e){}
  if(asked||bl==='fr'||!SAMPLE||!LANGS.find(l=>l[0]===bl))return;
  const b=$('#trbar');b.innerHTML=`<div class="trbar notr">🌐 <button class="btn sm" id="trYes">Translate this site into ${esc(langName(bl))}</button> <button class="btn sm ghost" id="trNo">Rester en français</button></div>`;
  $('#trYes').onclick=()=>{b.innerHTML='';$('#langSel').value=bl;setLang(bl);};
  $('#trNo').onclick=()=>{b.innerHTML='';try{localStorage.setItem('m4x_langask','1');}catch(e){}};
}
if(DRAFTS.cvText&&ui.cvText==null)ui.cvText=DRAFTS.cvText;
if(DRAFTS.consent){ui.consent=true;ui.consentAt=DRAFTS.consent;}
if(DRAFTS.photo)ui.photo=DRAFTS.photo;
initLangSel();
view=(location.hash||'').slice(1)||'accueil'; if(!VIEWS[view])view='accueil';
render();
(async function boot(){
  await afterLogin();
  const rt=new URLSearchParams(location.search).get('reset'); if(rt)resetModal(rt);
  setInterval(()=>{if(document.visibilityState==='visible')loadData();},15000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadData();});
})();
</script>
